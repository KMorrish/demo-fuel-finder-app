<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123b37">
    <title>Fuel finder | Australia</title>
    <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css">
    <link rel="stylesheet" href="./styles.css">
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script type="module" src="https://js.arcgis.com/5.1/"></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <aside id="sidebar" class="sidebar" aria-label="Fuel finder">
        <header class="app-header">
          <a class="wordmark" href="./" aria-label="Fuel finder home">fuel finder<span>.</span></a>
          <p>Find fuel and services along the way.</p>
        </header>

        <div class="sidebar-scroll">
          <section class="search-section" aria-labelledby="nearby-title">
            <div class="section-kicker">NEARBY SEARCH</div>
            <h1 id="nearby-title">Where are you headed?</h1>
            <form id="search-form" class="search-form">
              <label for="address-input">Address, suburb or postcode</label>
              <div class="input-wrap">
                <span class="pin-icon" aria-hidden="true">⌖</span>
                <input id="address-input" type="search" placeholder="e.g. Ballarat, VIC" autocomplete="off"
                  aria-autocomplete="list" aria-controls="search-suggestions" aria-expanded="false">
                <div class="search-suggestions" id="search-suggestions" role="listbox" aria-label="Address suggestions" hidden></div>
              </div>
              <div class="search-actions">
                <label class="radius-control" for="radius-select">
                  <span>Within</span>
                  <select id="radius-select" aria-label="Search radius">
                    <option value="5">5 km</option>
                    <option value="10" selected>10 km</option>
                    <option value="20">20 km</option>
                    <option value="50">50 km</option>
                  </select>
                </label>
                <button class="primary-button" type="submit">Search</button>
              </div>
            </form>
            <button id="locate-button" class="location-button" type="button">
              <span aria-hidden="true">◎</span> Use my location
            </button>
            <div id="search-message" class="status-message" role="status" aria-live="polite"></div>
          </section>

          <section class="trip-section" aria-labelledby="trip-title">
            <button id="trip-toggle" class="section-toggle" type="button" aria-expanded="false" aria-controls="trip-panel">
              <span class="route-icon" aria-hidden="true">↗</span>
              <span><strong id="trip-title">Plan a trip</strong><small>Find fuel stops along your route</small></span>
              <span class="toggle-chevron" aria-hidden="true">⌄</span>
            </button>
            <div id="trip-panel" class="trip-panel" hidden>
              <form id="trip-form">
                <label for="trip-start">Starting point</label>
                <input id="trip-start" type="text" placeholder="Enter a starting address" autocomplete="off" required>
                <label for="trip-end">Destination</label>
                <input id="trip-end" type="text" placeholder="Enter a destination" autocomplete="off" required>
                <button class="primary-button trip-submit" type="submit">Plan route</button>
              </form>
            </div>
          </section>

          <section class="filters-section" aria-labelledby="filters-title">
            <div class="section-title-row">
              <div>
                <div class="section-kicker">MAKE IT YOURS</div>
                <h2 id="filters-title">Filters</h2>
              </div>
              <button id="clear-filters" class="text-button" type="button">Clear all</button>
            </div>
            <div class="filter-group">
              <div class="filter-heading"><span>Fuel types</span><span class="match-control">Match
                <select id="fuel-match" aria-label="Fuel filter match behavior"><option value="any">any</option><option value="all">all</option></select>
              </span></div>
              <div id="fuel-filters" class="filter-options"></div>
            </div>
            <div class="filter-group">
              <div class="filter-heading"><span>Services</span><span class="match-control">Match
                <select id="service-match" aria-label="Service filter match behavior"><option value="any">any</option><option value="all">all</option></select>
              </span></div>
              <div id="service-filters" class="filter-options"></div>
            </div>
          </section>

          <section class="results-section" aria-labelledby="results-title">
            <div class="results-header">
              <div>
                <div class="section-kicker">YOUR SEARCH</div>
                <h2 id="results-title">Nearby sites <span id="result-count" class="result-count"></span></h2>
              </div>
              <button id="export-button" class="export-button" type="button" title="Download results as PDF" aria-label="Download results as PDF">↓ <span>PDF</span></button>
            </div>
            <div id="results-summary" class="results-summary">Search an address or use your location to see nearby sites.</div>
            <div id="results-list" class="results-list" aria-live="polite"></div>
          </section>

          <section id="detail-view" class="detail-view" hidden aria-label="Site details">
            <button id="back-button" class="back-button" type="button">← <span>Back to results</span></button>
            <div id="site-detail"></div>
          </section>
          <div id="app-error" class="app-error" role="alert" hidden></div>
        </div>
      </aside>

      <section class="map-region" aria-label="Map">
        <div id="map-view-container"></div>
        <div class="map-overlay"><span class="map-dot"></span><span>Australia fuel network</span></div>
        <button id="mobile-map-button" class="mobile-map-button" type="button">View map</button>
      </section>
    </main>
  </body>
</html>
